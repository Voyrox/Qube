apiVersion: apps/v1
kind: Deployment
metadata:
  name: qube
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qube
  template:
    metadata:
      labels:
        app: qube
    spec:
      imagePullSecrets:
        - name: harborcred
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qube
          image: harbor.ewenmacculloch.com/core/qube:1.0.2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 32002
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: qube
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: qube
  ports:
    - name: http
      port: 32002
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qube
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - qubecloud.org
      secretName: qube-tls
  rules:
    - host: qubecloud.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qube
                port:
                  number: 32002
