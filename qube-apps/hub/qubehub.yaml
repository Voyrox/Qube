apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qubehub-data
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 25Gi

---
apiVersion: v1
kind: Secret
metadata:
  name: qubehub-env
  namespace: apps
type: Opaque
stringData:
  ADDR: ":32003"
  DEBUG: "false"
  SCYLLA_HOSTS: "192.168.1.156"
  SCYLLA_LOCAL_DC: "Australia"
  SCYLLA_KEYSPACE: "qube_hub"
  SCYLLA_USERNAME: "ewen"
  SCYLLA_PASSWORD: "Tensor$35a"
  SCYLLA_TLS: "true"
  SCYLLA_TLS_INSECURE: "true"
  SCYLLA_TLS_CA_PATH: "/etc/scylla-tls/server.cas"
  SCYLLA_TLS_CERT_PATH: "/etc/scylla-tls/server.crt"
  SCYLLA_TLS_KEY_PATH: "/etc/scylla-tls/server.key"
  JWT_SECRET: "hddozMjn1Xv0cWlD9LwV9pQ6LSrpQkYh3JfG3u7Ac8mN2rB5VxTz4KsEaQnY1PcU"
  STORAGE_PATH: "/app/storage/images"
  MAX_UPLOAD_SIZE: "1073741824"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qubehub
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: qubehub
  template:
    metadata:
      labels:
        app: qubehub
    spec:
      imagePullSecrets:
        - name: harborcred
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qubehub
          image: harbor.ewenmacculloch.com/core/qubehub:1.0.11
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: qubehub-env
          ports:
            - name: http
              containerPort: 32003
          volumeMounts:
            - name: qubehub-data
              mountPath: /app/storage
            - name: qubehub-data
              mountPath: /app/static/avatars
            - name: qubehub-website
              mountPath: /app/index.html
              subPath: index.html
            - name: qubehub-website
              mountPath: /app/styles.css
              subPath: styles.css
            - name: qubehub-website
              mountPath: /app/script.js
              subPath: script.js
            - name: scylla-tls
              mountPath: /etc/scylla-tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: qubehub-data
          persistentVolumeClaim:
            claimName: qubehub-data
        - name: qubehub-website
          configMap:
            name: qubehub-website
        - name: scylla-tls
          secret:
            secretName: scylla-tls

---
apiVersion: v1
kind: Service
metadata:
  name: qubehub
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: qubehub
  ports:
    - name: http
      port: 32003
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qubehub
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - qubecloud.org
      secretName: qubehub-tls
  rules:
    - host: qubecloud.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qubehub
                port:
                  number: 32003
