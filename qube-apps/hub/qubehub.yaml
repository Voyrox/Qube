apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qubehub-data
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 25Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qubehub
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: qubehub
  template:
    metadata:
      labels:
        app: qubehub
    spec:
      imagePullSecrets:
        - name: harborcred
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qubehub
          image: harbor.ewenmacculloch.com/core/qubehub:1.0.3
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: qubehub-env
          ports:
            - name: http
              containerPort: 32003
          volumeMounts:
            - name: qubehub-data
              mountPath: /app/storage
            - name: qubehub-data
              mountPath: /app/static/avatars
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: qubehub-data
          persistentVolumeClaim:
            claimName: qubehub-data

---
apiVersion: v1
kind: Service
metadata:
  name: qubehub
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: qubehub
  ports:
    - name: http
      port: 32003
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qubehub
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - hub.qubecloud.org
      secretName: qubehub-tls
  rules:
    - host: hub.qubecloud.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qubehub
                port:
                  number: 32003
