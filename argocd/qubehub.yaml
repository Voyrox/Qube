apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qubehub
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Voyrox/Qube.git
    targetRevision: main
    path: qube-apps/hub
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
